<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>VCF Agent Portal (prototype)</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>VCF Agent Portal</h1>
    <p class="sub">Supervisor 연결 관리 &amp; VKS 클러스터 라이프사이클 (프로토타입)</p>
  </header>

  <main>
    <section>
      <div class="section-head">
        <h2>Supervisor 클러스터</h2>
        <button id="btn-show-add-supervisor">+ Supervisor 등록</button>
      </div>
      <form id="form-add-supervisor" class="inline-form hidden">
        <input type="text" name="name" placeholder="이름 (예: vcf-seoul-dc01)" required>
        <input type="text" name="vcf_instance" placeholder="VCF 인스턴스 (예: sc-seoul-01)" required>
        <button type="submit">등록</button>
        <button type="button" id="btn-cancel-add-supervisor" class="secondary">취소</button>
      </form>

      <div id="supervisor-yaml-panel" class="yaml-panel hidden">
        <div class="yaml-panel-head">
          <div>
            <p class="yaml-panel-title">Supervisor 등록 완료 — 에이전트 배포 YAML</p>
            <p class="yaml-panel-sub">아래 매니페스트를 대상 Supervisor 클러스터 컨텍스트에서 <code>kubectl apply -f -</code>로 적용하세요. 부트스트랩 토큰은 1회용이며 에이전트가 등록에 성공하면 자동으로 무효화됩니다.</p>
          </div>
          <div class="yaml-panel-actions">
            <button id="btn-copy-supervisor-yaml">YAML 복사</button>
            <button id="btn-copy-supervisor-apply" class="secondary">kubectl apply 명령 복사</button>
            <button id="btn-close-supervisor-yaml" class="secondary">닫기</button>
          </div>
        </div>
        <pre id="supervisor-yaml-content" class="yaml-content"></pre>
      </div>

      <div id="supervisors" class="card-list"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>VKS 클러스터</h2>
        <button id="btn-show-add-vks">+ VKS 클러스터 등록</button>
      </div>
      <form id="form-add-vks" class="inline-form hidden">
        <select name="supervisor_id" required></select>
        <input type="text" name="name" placeholder="이름 (예: order-svc-vks)" required>
        <input type="text" name="namespace" placeholder="네임스페이스" value="default">
        <input type="text" name="k8s_version" placeholder="K8s 버전" value="v1.29.4">
        <input type="number" name="control_plane_nodes" placeholder="Ctrl 노드 수" value="1" min="1">
        <input type="number" name="worker_nodes" placeholder="Worker 노드 수" value="2" min="1">
        <button type="submit">등록</button>
        <button type="button" id="btn-cancel-add-vks" class="secondary">취소</button>
      </form>
      <div id="vks-clusters" class="card-list"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
